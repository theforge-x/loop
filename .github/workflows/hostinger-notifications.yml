name: Hostinger notification worker
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: hostinger-notifications
  cancel-in-progress: false
jobs:
  notifications:
    if: vars.HOSTINGER_NOTIFICATIONS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: hostinger-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Process due notifications
        env:
          HOSTINGER_APP_URL: ${{ vars.HOSTINGER_APP_URL }}
          HOSTINGER_CRON_SECRET: ${{ secrets.HOSTINGER_CRON_SECRET }}
        run: node scripts/hostinger/run-notifications.mjs
