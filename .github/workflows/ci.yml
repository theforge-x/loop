name: Loop acceptance
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
concurrency:
  group: loop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start isolated real Supabase
        run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,supavisor,postgres-meta,mailpit
      - run: node scripts/prepare-ci-env.mjs
      - run: pnpm verify:connection
      - run: pnpm db:lint
      - run: pnpm check
      - run: pnpm test:unit
      - run: pnpm test:payments
      - run: pnpm test:email
      - run: pnpm test:database
      - run: pnpm test:public
      - run: pnpm test:invitations
      - run: pnpm test:administration
      - run: pnpm test:operations
      - run: pnpm test:release
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --reporter=github
      - name: Stop isolated Supabase
        if: always()
        run: pnpm supabase:stop
